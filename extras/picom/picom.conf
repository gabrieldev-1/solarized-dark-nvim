backend = "xrender";
vsync = true;

# shadows
shadow = true;
shadow-radius = 7;
shadow-opacity = 0.3;
shadow-offset-x = -7;
shadow-offset-y = -7;

#  fading
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
no-fading-openclose = true;
inactive-opacity-override = false

focus-exclude = [
    "class_g = 'i3lock'"

];

opacity-rule = [
    "90:class_g = 'Alacritty' && focused",
    "75:class_g = 'Alacritty' && !focused",
    "80:class_g = 'Rofi'"
];
